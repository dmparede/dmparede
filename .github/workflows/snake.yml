name: Generate snake & streak

on:
  # runs once a day
  schedule:
    - cron: "0 0 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # runs on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c7343a&color_dots=#ebedf0,#f8c9ca,#f08a8d,#d9474c,#a5232a
            dist/github-snake-dark.svg?color_snake=#f4a3a5&color_dots=#161b22,#4a1418,#7a1d22,#b8343a,#f06a6f

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=135,2a0d10,7a1d22&hide_border=true&border_radius=12&stroke=c7343a&ring=f4a3a5&fire=ffffff&currStreakNum=ffffff&sideNums=ffffff&currStreakLabel=f4a3a5&sideLabels=f4a3a5&dates=ffd1d2&timezone=Europe/Lisbon
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
