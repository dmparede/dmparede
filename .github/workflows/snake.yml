name: Generate snake & streak

on:
  # runs once a day
  schedule:
    - cron: "0 0 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # runs on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6964cb&color_dots=#ebedf0,#d4d2f2,#a6a3dc,#7f7ad6,#6964cb
            dist/github-snake-dark.svg?color_snake=#a6a3dc&color_dots=#161b22,#2d2a6e,#4a45a0,#6964cb,#a6a3dc

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=135,1a1740,3b3690&hide_border=true&border_radius=12&stroke=6964cb&ring=a6a3dc&fire=ffffff&currStreakNum=ffffff&sideNums=ffffff&currStreakLabel=a6a3dc&sideLabels=a6a3dc&dates=d4d2f2&timezone=Europe/Lisbon
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
